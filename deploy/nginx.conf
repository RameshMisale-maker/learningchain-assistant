# Reverse proxy for the Sapphirus Assistant (replace chat.sapphirus.in with your host name).
limit_req_zone $binary_remote_addr zone=chat:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=60r/m;

server {
    listen 80;
    server_name chat.sapphirus.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name chat.sapphirus.in;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 26m;                  # MAX_UPLOAD_MB + overhead
    server_tokens off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # Public website chat: widget, chat page, chat/feedback APIs (streaming must not be buffered)
    location = /widget.js { proxy_pass http://api:8000; }
    location = /chat      { proxy_pass http://api:8000; }
    location /api/v1/chat {
        limit_req zone=chat burst=10 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://api:8000;
    }
    location ~ ^/api/v1/(feedback|suggestions|me)$ { limit_req zone=chat burst=10 nodelay; proxy_pass http://api:8000; }

    # CMS / help-centre change notifications (HMAC-signed)
    location /api/v1/webhooks/ { limit_req zone=admin burst=20; proxy_pass http://api:8000; }

    # Administration - restrict to the office / VPN network (edit the allow list)
    location ~ ^/(admin|api/v1/admin) {
        # allow 203.0.113.0/24;   # office
        # deny all;
        limit_req zone=admin burst=30 nodelay;
        proxy_pass http://api:8000;
    }

    # Health endpoints for the load balancer / uptime monitor
    location ~ ^/health { proxy_pass http://api:8000; }

    # Everything else (OpenAPI docs, /v1 OpenAI-compatible API used by Open WebUI) stays internal
    location / { return 404; }
}

