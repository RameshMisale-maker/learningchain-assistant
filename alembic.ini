# Alembic migrations (schema changes are migrations - never manual SQL). The database URL comes from the app's
# settings (DATABASE_URL, SQLite by default). Usage:
#   alembic upgrade head            # apply all migrations (the app also does this at startup)
#   alembic downgrade -1            # undo the last migration
#   alembic revision -m "..." --autogenerate --rev-id 0003
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
