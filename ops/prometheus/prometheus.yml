# Self-hosted Prometheus (free): scrapes the assistant's /metrics (set METRICS_ENABLED=true on the API).
# Run:  docker run -p 9090:9090 -v ${PWD}/ops/prometheus:/etc/prometheus prom/prometheus
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: assistant
    metrics_path: /metrics
    # authorization:               # uncomment when METRICS_TOKEN is set on the API
    #   credentials: <METRICS_TOKEN>
    static_configs:
      - targets: ["host.docker.internal:8000"]
